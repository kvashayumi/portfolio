<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Сторінку не знайдено | Dmytro Kvasha</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 fill=%27%23000%27/%3E%3Ctext x=%2750%25%27 y=%2750%25%27 dominant-baseline=%27central%27 text-anchor=%27middle%27 font-family=%27Inter,Arial,sans-serif%27 font-weight=%27800%27 font-size=%2720%27 fill=%27%23fff%27%3ED%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:#fff;
    color:#000;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    position:relative;
    padding:24px;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  /* Хвилясті лінії на фоні — той самий мотив, що й на головній */
  #bgLines{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    opacity:.16;
    pointer-events:none;
    z-index:0;
  }

  .brand{
    position:fixed;
    top:28px;
    left:32px;
    z-index:2;
    font-weight:800;
    font-size:1.25rem;
    letter-spacing:-.01em;
    color:#000;
    text-decoration:none;
    transition:opacity .3s ease;
  }
  .brand:hover{ opacity:.5; }

  .content{
    position:relative;
    z-index:1;
    text-align:center;
    max-width:560px;
    opacity:0;
    transform:translateY(24px);
    animation:rise .8s cubic-bezier(.2,.7,.2,1) forwards;
  }

  .code{
    font-size:clamp(110px, 26vw, 260px);
    font-weight:800;
    line-height:.9;
    letter-spacing:-.05em;
    animation:float 6s ease-in-out infinite;
  }

  .divider{
    width:56px;
    height:3px;
    background:#000;
    margin:28px auto 24px;
  }

  .title{
    font-size:clamp(20px, 4vw, 28px);
    font-weight:800;
    letter-spacing:-.01em;
    margin-bottom:14px;
  }

  .desc{
    font-size:16px;
    line-height:1.6;
    color:#666;
    max-width:420px;
    margin:0 auto 36px;
  }

  .actions{
    display:flex;
    gap:16px;
    justify-content:center;
    flex-wrap:wrap;
  }

  .btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:16px 40px;
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    text-decoration:none;
    cursor:pointer;
    border-radius:0;
    transition:transform .3s ease, background .3s ease, color .3s ease, box-shadow .3s ease;
  }
  .btn-dark{ background:#000; color:#fff; border:2px solid #000; }
  .btn-dark:hover{ transform:translateY(-3px); box-shadow:0 12px 24px -8px rgba(0,0,0,.4); }
  .btn-outline{ background:transparent; color:#000; border:2px solid #000; }
  .btn-outline:hover{ background:#000; color:#fff; transform:translateY(-3px); }

  .btn:focus-visible,
  .brand:focus-visible{ outline:2px solid #000; outline-offset:4px; }

  @keyframes rise{ to{ opacity:1; transform:translateY(0); } }
  @keyframes float{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-14px); } }

  @media (max-width:575px){
    .brand{ top:20px; left:20px; font-size:1.1rem; }
    .actions{ flex-direction:column; }
    .btn{ width:100%; padding:14px 24px; }
    .code{ letter-spacing:-.04em; }
  }

  @media (prefers-reduced-motion: reduce){
    .content{ animation:none; opacity:1; transform:none; }
    .code{ animation:none; }
  }
</style>
</head>
<body>
  <canvas id="bgLines"></canvas>
  <a href="/" class="brand">Dmytro Kvasha</a>

  <main class="content">
    <div class="code">404</div>
    <div class="divider"></div>
    <h1 class="title">Сторінку не знайдено</h1>
    <p class="desc">Можливо, адресу введено неправильно, сторінку переміщено або вона більше не існує.</p>
    <div class="actions">
      <a href="/" class="btn btn-dark">На головну</a>
      <a href="/#portfolio" class="btn btn-outline">Переглянути роботи</a>
    </div>
  </main>

<script>
  // --- Хвилясті лінії на фоні (як у hero на головній) ---
  var canvas = document.getElementById('bgLines');
  var ctx = canvas.getContext('2d');
  var w, h, lines = [];
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function init(){
    w = canvas.width = window.innerWidth;
    h = canvas.height = window.innerHeight;
    lines = Array.from({ length: 7 }, function(){
      return {
        y: Math.random() * h,
        speed: 0.0015 + Math.random() * 0.002,
        offset: Math.random() * Math.PI * 2,
        amp: 40 + Math.random() * 60
      };
    });
  }

  function draw(t){
    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 0.6;
    lines.forEach(function(l){
      ctx.beginPath();
      ctx.moveTo(0, l.y);
      for (var x = 0; x <= w; x += 10){
        ctx.lineTo(x, l.y + Math.sin(t * l.speed + x * 0.006 + l.offset) * l.amp);
      }
      ctx.stroke();
    });
    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', init);
  init();
  if (reduce) { draw(2000); } else { draw(0); }
</script>
</body>
</html>
